<!-- Create Nab bar -->

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        #nav
        {
            background-color: #25D366;
            font-size: larger;
            height: 50px;
            width: 50%;
            margin-left: 25%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
        }
        ul{
            display: flex;
            list-style-type: none;
            color: rgb(27, 24, 24);
        }
        .a{
            margin: 20px;
            padding: 30px;
        }
        li:hover{
            color: white;
            cursor: pointer;
        }

    </style>

</head>

<body>
    <nav id="nav">
        <ul>
            <li class="a">Chat</li>
            <li class="a">Updates</li>
            <li class="a">Communities</li>
            <li class="a">Call</li>
        </ul>
    </nav>
</body>

</html>
